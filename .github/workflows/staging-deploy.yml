name: Staging Deploy (excel2.bcsrp.ir only)

# Automates STAGING code sync for https://excel2.bcsrp.ir/ after main CI is green.
# NEVER targets production (excel.bcsrp). NEVER auto-migrates DB. NEVER deploys engine/.
#
# Primary path (no SSH / no PAT on host): after Commercial MVP + RC1 MySQL PHP succeed
# on the exact main SHA, publish a downloadable GitHub Release package. cPanel cron
# runs scripts/staging_cron_deploy.php (PHP CLI ≥8.1) under /home3/zzflgmfd/erpsmart-deploy/.
# Python3 is unavailable in cPanel jailshell — host Deployment Manager MUST be PHP.
#
# Optional SSH path (legacy): STAGING_SSH_* secrets still supported for push-apply.
# Optional:
#   STAGING_SSH_PORT          (default 22)
#   STAGING_REMOTE_DEST       (must be /home3/zzflgmfd/excel2.bcsrp)
#
# Without cron on host AND without SSH secrets: PARTIAL (Release package only).
# Real apply is main-branch only; CI gates cannot be bypassed on the apply path.
# Never claim STAGING_DEPLOY_VERIFIED from ZIP build alone.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: "SSH apply to staging (optional; cron pull is preferred when SSH unavailable)"
        type: boolean
        default: true
      dry_run_only:
        description: "Force dry-run even if apply would otherwise be true (package + remote plan only)"
        type: boolean
        default: false
      publish_release:
        description: "Publish GitHub Release assets after gates (default true on main)"
        type: boolean
        default: true

concurrency:
  group: staging-deploy-excel2
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  package-and-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      git_sha: ${{ steps.meta.outputs.sha }}
      apply_wanted: ${{ steps.applydec.outputs.apply }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record commit
        id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve apply decision (no false→true coercion)
        id: applydec
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Fixed semantics: push → true; workflow_dispatch → inputs.apply; never `x && y || true`
          INPUT_APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply || github.event_name == 'push' }}
          DRY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run_only || false }}
          REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from staging_apply_decision import resolve_apply, workflow_apply_env_value

          event = os.environ.get("EVENT_NAME", "")
          # INPUT_APPLY is already the corrected boolean expression from the workflow.
          # Re-derive via helper for an independent unit-tested path.
          if event == "workflow_dispatch":
              # GitHub passes boolean inputs as the string 'true'/'false'
              raw = os.environ.get("INPUT_APPLY", "false").strip().lower()
              inputs_apply = raw in {"true", "1", "yes"}
          else:
              inputs_apply = False
          apply = resolve_apply(event_name=event, inputs_apply=inputs_apply)
          if os.environ.get("DRY_ONLY", "false").strip().lower() in {"true", "1", "yes"}:
              apply = False
          ref = os.environ.get("REF", "")
          print(f"event={event} ref={ref} apply={apply}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"apply={'true' if apply else 'false'}\n")
              fh.write(f"apply_env={workflow_apply_env_value(event, inputs_apply if event=='workflow_dispatch' else True)}\n")
          PY
      - name: Controlled sync selftest
        run: python scripts/agentic_controlled_cpanel_sync.py --selftest
      - name: Staging health allowlist selftest
        run: python scripts/staging_health_check.py --selftest
      - name: Apply decision selftest (coercion guard)
        run: python scripts/staging_apply_decision.py
      - name: Build exact-commit staging package + ZIP + dry-run plan
        run: |
          python scripts/staging_package_build.py \
            --out storage/cache/staging_pkg \
            --dry-run-plan \
            --zip \
            --manifest-out storage/cache/staging_pkg/build_manifest.json
          python scripts/build_cron_bootstrap_zip.py \
            --out storage/cache/staging_pkg/erpsmart-cron-bootstrap.zip
          python scripts/staging_cron_deploy.py --selftest
      - name: Staging package + apply unit checks
        run: |
          python -m unittest \
            tests.test_staging_package_guards \
            tests.test_staging_apply_decision \
            tests.test_staging_remote_apply_adversarial \
            tests.test_staging_cron_deploy_adversarial \
            tests.test_master_data_and_report_builder \
            tests.test_proposal_ui_local_uat \
            tests.test_universal_ai_agent_routing \
            -v
          python scripts/staging_migrate_preflight.py --selftest
          python scripts/staging_worker_install.py --print-provider-rebuild > /tmp/provider_rebuild.json
      - name: Commercial release gate (unchanged strength)
        run: python scripts/release_gate.py --require-php --require-node
      - name: Upload staging package artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-pkg-${{ steps.meta.outputs.sha }}
          path: storage/cache/staging_pkg/
          if-no-files-found: error
          retention-days: 14

  php-cron-deploy-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: package-and-gates
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, zip
          coverage: none
      - name: PHP Deployment Manager selftest + adversarial
        run: |
          php -v
          php scripts/staging_cron_deploy.php --selftest
          php tests/php_staging_cron_deploy_adversarial_test.php
          php -l scripts/staging_cron_deploy.php
          php -l scripts/lib/erpsmart_controlled_sync.php
          php -l scripts/lib/erpsmart_staging_health.php

  await-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: package-and-gates
    # Always required — skip_await_ci removed; apply path cannot bypass gates.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for required checks on exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.package-and-gates.outputs.git_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Awaiting release-gate + rc1-mysql-php on $SHA"
          python scripts/staging_await_ci.py --repo "$REPO" --sha "$SHA" --timeout-sec 2400

  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [package-and-gates, await-ci, php-cron-deploy-compat]
    if: >-
      always()
      && needs.package-and-gates.result == 'success'
      && needs.await-ci.result == 'success'
      && needs.php-cron-deploy-compat.result == 'success'
      && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download staging package
        uses: actions/download-artifact@v4
        with:
          name: staging-pkg-${{ needs.package-and-gates.outputs.git_sha }}
          path: storage/cache/staging_pkg
      - name: Stamp gates success on public release meta
        env:
          SHA: ${{ needs.package-and-gates.outputs.git_sha }}
        run: |
          set -euo pipefail
          python scripts/staging_package_build.py \
            --out storage/cache/staging_pkg \
            --stamp-gates-success \
            --expected-sha "$SHA"
          # Also stamp PUBLIC meta used by cron pull (authoritative checksum + gates).
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          sha = os.environ["SHA"]
          pkg = Path("storage/cache/staging_pkg")
          pub = pkg / "ERPSMART_STAGING_RELEASE_PUBLIC.json"
          if not pub.is_file():
              raise SystemExit("public_meta_missing")
          data = json.loads(pub.read_text(encoding="utf-8"))
          if data.get("git_sha") != sha:
              raise SystemExit(f"sha_mismatch:{data.get('git_sha')}!={sha}")
          # Sidecar checksum is authoritative for the ZIP bytes.
          zips = sorted(pkg.glob("erpsmart-staging-php-*.zip"))
          if not zips:
              raise SystemExit("zip_missing")
          z = zips[0]
          sidecar = Path(str(z) + ".sha256")
          if not sidecar.is_file():
              raise SystemExit("sha256_sidecar_missing")
          digest = sidecar.read_text(encoding="utf-8").split()[0].strip().lower()
          data["package_zip"] = z.name
          data["package_zip_sha256"] = digest
          data["gates"] = {
              "release-gate": "success",
              "rc1-mysql-php": "success",
              "verified_at_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "verified_on_sha": sha,
          }
          # Embed per-file hashes from inner release meta when present.
          inner = pkg / "ERPSMART_STAGING_RELEASE.json"
          if inner.is_file():
              inn = json.loads(inner.read_text(encoding="utf-8"))
              data["files_sha256"] = inn.get("files_sha256") or {}
              data["file_manifest"] = inn.get("file_manifest") or sorted(data["files_sha256"])
          pub.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"ok": True, "sha": sha, "zip": z.name, "zip_sha256": digest}, indent=2))
          PY
      - name: Publish GitHub Release assets (public download, no host PAT)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.package-and-gates.outputs.git_sha }}
        run: |
          set -euo pipefail
          TAG="staging-excel2-${SHA}"
          TITLE="Staging excel2 package ${SHA}"
          NOTES="$(cat <<EOF
          Staging-only release package for https://excel2.bcsrp.ir/

          - git_sha: ${SHA}
          - branch: main
          - gates: release-gate + rc1-mysql-php = success (exact SHA)
          - secrets/config/DB/uploads/logs: NOT included
          - apply: cPanel PHP cron → /home3/zzflgmfd/erpsmart-deploy/bin/staging_cron_deploy.php
          - NEVER production excel.bcsrp
          - Host runtime: PHP CLI (Python3 unavailable in jailshell)

          Do not confuse Actions artifacts with these public Release assets.
          EOF
          )"
          # Replace prior tag/release for same SHA if re-run; otherwise create.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes || true
            git push origin ":refs/tags/$TAG" || true
          fi
          git tag -f "$TAG" "$SHA"
          git push origin "$TAG" --force
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "$SHA" \
            storage/cache/staging_pkg/erpsmart-staging-php-*.zip \
            storage/cache/staging_pkg/erpsmart-staging-php-*.zip.sha256 \
            storage/cache/staging_pkg/ERPSMART_STAGING_RELEASE_PUBLIC.json \
            storage/cache/staging_pkg/erpsmart-cron-bootstrap.zip
          echo "Published release $TAG"
      - name: Upload publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-release-evidence-${{ needs.package-and-gates.outputs.git_sha }}
          path: |
            storage/cache/staging_pkg/ERPSMART_STAGING_RELEASE_PUBLIC.json
            storage/cache/staging_pkg/ERPSMART_STAGING_RELEASE.json
            storage/cache/staging_pkg/build_manifest.json
          if-no-files-found: ignore
          retention-days: 30

  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [package-and-gates, await-ci]
    # Optional SSH path — cron pull is preferred when owner has no SSH.
    # Real deploy requires package success AND await-ci success (never skipped).
    if: always() && needs.package-and-gates.result == 'success' && needs.await-ci.result == 'success'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download staging package
        uses: actions/download-artifact@v4
        with:
          name: staging-pkg-${{ needs.package-and-gates.outputs.git_sha }}
          path: storage/cache/staging_pkg
      - name: Detect SSH secret presence (names only)
        id: ssh
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          python - <<'PY'
          import os, json
          names = ["STAGING_SSH_HOST","STAGING_SSH_USER","STAGING_SSH_PRIVATE_KEY","STAGING_SSH_KNOWN_HOSTS"]
          present = {n: bool(os.environ.get(n)) for n in names}
          ready = all(present.values())
          print(json.dumps({"present": present, "ready": ready}))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"ready={'true' if ready else 'false'}\n")
          PY
      - name: Partial — SSH not configured (cron pull is primary)
        if: steps.ssh.outputs.ready != 'true'
        run: |
          echo "STAGING_AUTO_DEPLOY_PARTIAL: GitHub SSH secrets not configured."
          echo "Primary path: GitHub Release assets + cPanel PHP cron pull (erpsmart-deploy bootstrap)."
          echo "Package/Release for exact SHA ${{ needs.package-and-gates.outputs.git_sha }}."
          echo "One-time host setup: extract erpsmart-cron-bootstrap.zip under /home3/zzflgmfd/erpsmart-deploy/"
          echo "Cron: /usr/bin/php .../bin/staging_cron_deploy.php --apply --i-understand-staging-risk"
          echo "Worker/engine remains PARTIAL on Windows/Python host (version-matched SHA). Migrations NOT_RUN."
      - name: Refuse apply off main
        if: steps.ssh.outputs.ready == 'true' && github.ref != 'refs/heads/main'
        run: |
          echo "REFUSED: real staging apply is main-branch only (ref=${{ github.ref }})."
          exit 3
      - name: Materialize pinned SSH files
        if: steps.ssh.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh_staging"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh_staging/id_deploy"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$HOME/.ssh_staging/known_hosts"
          chmod 600 "$HOME/.ssh_staging/id_deploy" "$HOME/.ssh_staging/known_hosts"
      - name: Remote dry-run / apply (staging only)
        if: steps.ssh.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_REMOTE_DEST: ${{ secrets.STAGING_REMOTE_DEST }}
          STAGING_GIT_REF: ${{ github.ref }}
          STAGING_AWAIT_CI_RESULT: success
          # Correct boolean: push applies; dispatch uses inputs.apply; dry_run_only forces false.
          # NEVER use `A && B || true` (coerces false→true).
          APPLY: ${{ needs.package-and-gates.outputs.apply_wanted }}
        run: |
          set -euo pipefail
          export STAGING_SSH_PRIVATE_KEY_PATH="$HOME/.ssh_staging/id_deploy"
          export STAGING_SSH_KNOWN_HOSTS_PATH="$HOME/.ssh_staging/known_hosts"
          DEST="${STAGING_REMOTE_DEST:-/home3/zzflgmfd/excel2.bcsrp}"
          export STAGING_REMOTE_DEST="$DEST"
          echo "APPLY=${APPLY}"
          if [ "$APPLY" = "true" ]; then
            python scripts/staging_remote_apply.py \
              --package storage/cache/staging_pkg \
              --apply --i-understand-staging-risk \
              --expected-sha "${{ needs.package-and-gates.outputs.git_sha }}" \
              --manifest-out storage/cache/staging_remote_apply.json
          else
            python scripts/staging_remote_apply.py \
              --package storage/cache/staging_pkg \
              --expected-sha "${{ needs.package-and-gates.outputs.git_sha }}" \
              --manifest-out storage/cache/staging_remote_apply.json
          fi
      - name: Post-deploy staging health check (release identity required on apply)
        if: steps.ssh.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        env:
          APPLY: ${{ needs.package-and-gates.outputs.apply_wanted }}
          SHA: ${{ needs.package-and-gates.outputs.git_sha }}
        run: |
          set -euo pipefail
          if [ "$APPLY" = "true" ]; then
            python scripts/staging_health_check.py \
              --url https://excel2.bcsrp.ir/ \
              --require-release \
              --expected-sha "$SHA" \
              --manifest-out storage/cache/staging_health.json
          else
            python scripts/staging_health_check.py \
              --url https://excel2.bcsrp.ir/ \
              --manifest-out storage/cache/staging_health.json || true
          fi
      - name: Rollback on health failure
        if: failure() && steps.ssh.outputs.ready == 'true' && github.ref == 'refs/heads/main' && needs.package-and-gates.outputs.apply_wanted == 'true'
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_REMOTE_DEST: ${{ secrets.STAGING_REMOTE_DEST }}
        run: |
          set -euo pipefail
          export STAGING_SSH_PRIVATE_KEY_PATH="$HOME/.ssh_staging/id_deploy"
          export STAGING_SSH_KNOWN_HOSTS_PATH="$HOME/.ssh_staging/known_hosts"
          DEST="${STAGING_REMOTE_DEST:-/home3/zzflgmfd/excel2.bcsrp}"
          # Restore is performed inside staging_remote_apply on verify failure; this step
          # records evidence that health failed after apply so operators inspect backup dirs.
          echo "HEALTH_FAILED_AFTER_APPLY — inspect remote _erpsmart_staging_code_bak_* under $(dirname "$DEST")"
          if [ -f storage/cache/staging_remote_apply.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path("storage/cache/staging_remote_apply.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps({"backup_dir": (data.get("apply") or {}).get("backup_dir"), "status": data.get("status")}, indent=2))
          PY
          fi
          exit 1
      - name: Upload deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deploy-evidence-${{ needs.package-and-gates.outputs.git_sha }}
          path: |
            storage/cache/staging_remote_apply.json
            storage/cache/staging_health.json
            storage/cache/staging_pkg/ERPSMART_STAGING_RELEASE.json
          if-no-files-found: ignore
          retention-days: 30
